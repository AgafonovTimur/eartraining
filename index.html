<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ear Trainer — тренажёр слуха (MIDI/DAW)</title>
<style>
  /* ===== Темы ===== */
  :root, [data-theme="2"] {
    --bg-color: #121212;
    --panel-bg: #1e1e1e;
    --panel-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

    --chip-bg: #2b2b2b;
    --chip-border: #3a3a3a;
    --chip-text: #b0b0b0;
    --chip-hover-bg: #353535;
    --chip-hover-text: #ffffff;
    --chip-selected-bg: #444444;
    --chip-selected-border: #666666;
    --chip-selected-text: #ffffff;

    --btn-bg: #2d2d2d;
    --btn-border: #3d3d3d;
    --btn-text: #a0a0a0;
    --btn-hover-bg: #383838;
    --btn-hover-text: #ffffff;
    --btn-active-bg: #4a4a4a;
    --btn-active-text: #ffffff;

    --segment-bg: #282828;
    --divider-color: #2a2a2a;
    --text-muted: #888888;
    --title-color: #888888;
    --text-hint: #666666;
    --select-bg: #2b2b2b;
    --bad-color: rgba(235, 75, 75, 0.8);
    --ok-color: rgba(85, 214, 110, 0.7);
    --bad-glow-filter: none;
    --ok-glow-filter: none;
    --ok-text-glow: none;
    --bad-text-glow: none;
    --ok-box-glow: none;
    --bad-box-glow: none;
    --badge-ok: rgba(85, 214, 110, 0.7);
    --badge-bad: rgba(235, 75, 75, 0.8);
  }

  [data-theme="1"] {
    --bg-color: #181818;
    --panel-bg: #212121;
    --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

    --chip-bg: #2e2e2e;
    --chip-border: #383838;
    --chip-text: #a8a8a8;
    --chip-hover-bg: #383838;
    --chip-hover-text: #ffffff;
    --chip-selected-bg: #4a4a4a;
    --chip-selected-border: #5a5a5a;
    --chip-selected-text: #ffffff;

    --btn-bg: #2b2b2b;
    --btn-border: #363636;
    --btn-text: #999999;
    --btn-hover-bg: #363636;
    --btn-hover-text: #ffffff;
    --btn-active-bg: #424242;
    --btn-active-text: #ffffff;

    --segment-bg: #262626;
    --divider-color: #2c2c2c;
    --text-muted: #7d7d7d;
    --title-color: #7d7d7d;
    --text-hint: #5c5c5c;
    --select-bg: #2a2a2a;
    --bad-color: rgba(235, 75, 75, 0.8);
    --ok-color: rgba(85, 214, 110, 0.7);
    --bad-glow-filter: none;
    --ok-glow-filter: none;
    --ok-text-glow: none;
    --bad-text-glow: none;
    --ok-box-glow: none;
    --bad-box-glow: none;
    --badge-ok: rgba(85, 214, 110, 0.7);
    --badge-bad: rgba(235, 75, 75, 0.8);
  }

  [data-theme="3"] {
    --bg-color: #0b0e14;
    --panel-bg: #131722;
    --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);

    --chip-bg: #1c2230;
    --chip-border: #273044;
    --chip-text: #a0aec0;
    --chip-hover-bg: #252d40;
    --chip-hover-text: #ffffff;
    --chip-selected-bg: #1b212f;
    --chip-selected-border: #e58e38;
    --chip-selected-text: #f59e0b;

    --btn-bg: #1c2230;
    --btn-border: #273044;
    --btn-text: #a0aec0;
    --btn-hover-bg: #252d40;
    --btn-hover-text: #ffffff;
    --btn-active-bg: #1b212f;
    --btn-active-text: #f59e0b;

    --segment-bg: #10141d;
    --divider-color: #1f2738;
    --text-muted: #718096;
    --title-color: #f59e0b;
    --text-hint: #516075;
    --select-bg: #181f2c;
    --bad-color: rgba(235, 75, 75, 0.8);
    --ok-color: rgba(85, 214, 110, 0.7);
    --bad-glow-filter: none;
    --ok-glow-filter: none;
    --ok-text-glow: none;
    --bad-text-glow: none;
    --ok-box-glow: none;
    --bad-box-glow: none;
    --badge-ok: rgba(85, 214, 110, 0.7);
    --badge-bad: rgba(235, 75, 75, 0.8);
  }

  [data-theme="4"] {
    --bg-color: #121212;
    --panel-bg: #1e1e1e;
    --panel-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

    --chip-bg: #2b2b2b;
    --chip-border: #3a3a3a;
    --chip-text: #b0b0b0;
    --chip-hover-bg: #353535;
    --chip-hover-text: #ffffff;
    --chip-selected-bg: #25221e;
    --chip-selected-border: #e58e38;
    --chip-selected-text: #f59e0b;

    --btn-bg: #2d2d2d;
    --btn-border: #3d3d3d;
    --btn-text: #a0a0a0;
    --btn-hover-bg: #383838;
    --btn-hover-text: #ffffff;
    --btn-active-bg: #28241e;
    --btn-active-text: #f59e0b;

    --segment-bg: #282828;
    --divider-color: #2a2a2a;
    --text-muted: #888888;
    --title-color: #f59e0b;
    --text-hint: #666666;
    --select-bg: #2b2b2b;
    --bad-color: rgba(235, 75, 75, 0.8);
    --ok-color: rgba(85, 214, 110, 0.7);
    --bad-glow-filter: none;
    --ok-glow-filter: none;
    --ok-text-glow: none;
    --bad-text-glow: none;
    --ok-box-glow: none;
    --bad-box-glow: none;
    --badge-ok: rgba(85, 214, 110, 0.7);
    --badge-bad: rgba(235, 75, 75, 0.8);
  }

  /* colormode: neon — цвета и свечение подписей нот, скопировано 1 в 1 из гуслей */
  html[data-colormode="neon"], body[data-colormode="neon"]{
    --bad-color: #eb4b4b;
    --ok-color: #55d66e;
    --bad-glow-filter: none;
    --ok-glow-filter: none;
    --ok-text-glow: 0 0 2px rgba(85, 214, 110, 0.9), 0 0 8px rgba(85, 214, 110, 0.55), 0 0 16px rgba(85, 214, 110, 0.3);
    --bad-text-glow: 0 0 2px rgba(235, 75, 75, 0.9), 0 0 8px rgba(235, 75, 75, 0.55), 0 0 16px rgba(235, 75, 75, 0.3);
    --ok-box-glow: 0 0 6px rgba(85, 214, 110, 0.35), inset 0 0 8px rgba(85, 214, 110, 0.15);
    --bad-box-glow: 0 0 6px rgba(235, 75, 75, 0.35), inset 0 0 8px rgba(235, 75, 75, 0.15);
    --badge-ok: #55d66e;
    --badge-bad: #eb4b4b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: var(--bg-color);
    color: #e1e1e1;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app-layout {
    position: static;
    width: 100%;
  }

  /* Главное меню — всегда строго по центру экрана, не двигается при скролле */
  .menu-panel.left-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    background-color: var(--panel-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--panel-shadow);
    display: flex;
    flex-direction: column;
    gap: 20px;
    border: 1px solid var(--chip-border);
    z-index: 1;
  }

  /* Панель настроек — справа от основного меню, появляется/исчезает с анимацией (не привязана к краю страницы) */
  .menu-panel.right-panel {
    position: fixed;
    top: 50%;
    left: calc(50% + 325px);
    width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    background-color: var(--panel-bg);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--panel-shadow);
    display: flex;
    flex-direction: column;
    gap: 20px;
    border: 1px solid var(--chip-border);
    z-index: 2;
    opacity: 0;
    visibility: hidden;
    transform: translate(30px, -50%);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
  }

  .menu-panel.right-panel.visible {
    opacity: 1;
    visibility: visible;
    transform: translate(0, -50%);
  }

  .nav-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 4px;
  }

  .tab-btn {
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    padding: 10px 0;
    border-radius: 4px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
  }

  .tab-btn:hover {
    background-color: var(--btn-hover-bg);
    color: var(--btn-hover-text);
  }

  .tab-btn.active {
    background-color: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--chip-selected-border);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  .section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--title-color);
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .quick-actions-left {
    display: flex;
    justify-content: flex-start;
    gap: 16px;
    margin-top: 2px;
    margin-bottom: 2px;
  }

  /* ===== Сетка пианино (14 колонок, как в новом дизайне) ===== */
  .piano-grid {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    column-gap: 4px;
    row-gap: 8px;
  }

  .piano-grid .toggle-chip {
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    padding: 0;
  }

  .piano-grid .toggle-chip.black-key {
    height: 34px;
    font-size: 10.5px;
  }

  /* ===== Сетка интервалов (2 колонки) ===== */
  .intervals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* ===== Сетка аккордов (4 колонки) ===== */
  .chords-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .chords-grid .toggle-chip,
  .intervals-grid .toggle-chip {
    width: auto;
    padding: 10px 4px;
    border-radius: 6px;
    font-size: 12px;
  }

  /* ===== Октавы ===== */
  .octaves-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .octaves-row .toggle-chip {
    flex: 1 1 calc(20% - 7px);
    padding: 10px 6px;
    text-align: center;
  }

  /* ===== Вывод звука ===== */
  .audio-output-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* ===== Блок группировки настроек (аналог midi-box) ===== */
  .settings-box {
    background-color: var(--segment-bg);
    border: 1px solid var(--divider-color);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .midi-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .theme-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .theme-row select {
    flex: none;
    width: auto;
    padding: 6px 10px;
  }

  .colormode-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .text-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .text-btn:hover {
    color: #ccc;
  }

  .grid-chips {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }

  .toggle-chip {
    background-color: var(--chip-bg);
    border: 2px solid var(--chip-border);
    color: var(--chip-text);
    padding: 8px 2px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    user-select: none;
    white-space: nowrap;
  }

  .note-chip {
    width: 48px;
    flex: 0 0 48px;
    padding: 8px 0;
  }

  .left-note-chip {
    width: 72px;
    flex: 0 0 72px;
    padding: 8px 0;
  }

  .toggle-chip:hover {
    background-color: var(--chip-hover-bg);
    color: var(--chip-hover-text);
  }

  .toggle-chip.selected {
    background-color: var(--chip-selected-bg);
    border-color: var(--chip-selected-border);
    color: var(--chip-selected-text);
    font-weight: 600;
  }

  .toggle-chip.correct,
  #pianoAnswer .toggle-chip.correct,
  #chipAnswer .toggle-chip.correct,
  #octaveAnswerRow .toggle-chip.correct {
    background-color: var(--chip-bg) !important;
    border-width: 2px !important;
    border-style: solid !important;
    border-color: var(--ok-color) !important;
    color: var(--ok-color) !important;
    font-weight: 600 !important;
    opacity: 1 !important;
  }

  .toggle-chip.incorrect,
  #pianoAnswer .toggle-chip.incorrect,
  #chipAnswer .toggle-chip.incorrect,
  #octaveAnswerRow .toggle-chip.incorrect {
    background-color: var(--chip-bg) !important;
    border-width: 2px !important;
    border-style: solid !important;
    border-color: var(--bad-color) !important;
    color: var(--bad-color) !important;
    font-weight: 600 !important;
    opacity: 1 !important;
  }

  .toggle-chip.disabled {
    pointer-events: none;
    opacity: 0.6;
  }

  .notes-flex-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .notes-flex-container.chord-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px 10px;
  }

  .chord-chip {
    width: auto;
    padding: 10px 6px;
    border-radius: 18px;
    font-size: 12.5px;
  }

  .piano-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }

  .white-keys-row {
    display: flex;
    gap: 6px;
    justify-content: center;
  }

  .black-keys-row {
    position: relative;
    width: 540px;
    height: 34px;
  }

  .black-keys-row .black-key {
    position: absolute;
    top: 0;
  }

  .answer-group-box {
    width: 100%;
    background: transparent;
    padding: 15px;
    border-radius: 8px;
    border: none;
  }

  .answer-chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    width: 100%;
  }

  .answer-chip-grid .toggle-chip {
    width: auto;
    padding: 10px 4px;
    font-size: 12px;
    text-align: center;
    flex-grow: 1;
  }

  /* Размеры кнопок в окне ответа (перенесено из макета) */
  .answer-chip-grid.mode-intervals .toggle-chip { flex-basis: 45%; min-width: 120px; }
  .answer-chip-grid.mode-chords .toggle-chip { flex-basis: 22%; min-width: 65px; }

  .answer-octaves-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    width: 100%;
    margin-top: 8px;
  }

  .answer-octaves-row .toggle-chip {
    flex-basis: 12%;
    min-width: 35px;
    width: auto;
    padding: 10px 4px;
    font-size: 12px;
    text-align: center;
    flex-grow: 1;
  }

  .segmented-control {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
    gap: 8px;
  }

  .segment-btn {
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
  }

  .segment-btn:hover {
    background-color: var(--btn-hover-bg);
    color: var(--btn-hover-text);
  }

  .segment-btn.active {
    background-color: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--chip-selected-border);
    font-weight: 600;
  }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
  }

  .volume-slider {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--chip-bg);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    cursor: pointer;
  }

  .volume-value {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 32px;
    text-align: right;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-label {
    font-size: 12px;
    color: var(--text-muted);
  }

  select {
    width: 100%;
    background-color: var(--select-bg);
    color: #e1e1e1;
    border: 1px solid var(--chip-border);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 14px;
  }

  .hint-text {
    font-size: 11px;
    color: var(--text-hint);
    line-height: 1.4;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .checkbox-row input {
    display: none;
  }

  .custom-checkbox {
    width: 16px;
    height: 16px;
    background-color: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .checkbox-row input:checked + .custom-checkbox {
    background-color: var(--chip-selected-bg);
    border-color: var(--chip-selected-border);
  }

  .checkbox-row input:checked + .custom-checkbox::after {
    content: "✓";
    color: var(--chip-selected-text);
    font-size: 11px;
    font-weight: bold;
  }

  .checkbox-label {
    font-size: 13px;
    color: #ccc;
  }

  .action-row {
    display: flex;
    gap: 10px;
    width: 320px;
    margin: 0 auto;
  }

  .btn-action {
    flex: 1;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--btn-border);
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-action:hover {
    background-color: var(--btn-hover-bg);
    color: var(--btn-hover-text);
  }

  .feedback-indicator {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0;
    min-height: 120px;
  }

  .feedback-icon {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'PT Serif', serif;
    font-weight: 700;
    font-size: 85px;
    line-height: 1;
    color: var(--text-hint);
    opacity: 0.35;
    transition: color 0.2s ease, opacity 0.2s ease;
  }

  .feedback-icon.state-correct {
    color: var(--badge-ok);
    opacity: 0.7;
  }

  .feedback-icon.state-incorrect {
    color: var(--badge-bad);
    opacity: 0.7;
  }

  .feedback-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-hint);
    margin-top: -6px;
  }

  .status-line {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    min-height: 16px;
  }

  .divider {
    height: 1px;
    background-color: var(--divider-color);
    margin: 2px 0;
  }

  details {
    font-size: 12px;
    color: var(--text-hint);
  }

  details summary {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 6px;
  }

  details p, details li {
    color: var(--text-hint);

<script>
(function () {

  const CFG = Object.assign(

      noteDurationMs: 900,
      chordStrumMs: 0,
      defaultMidiChannel: 1,

  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const MIN_MIDI = 21;

  const CHORDS = [
    { id: 'maj', name: 'Мажор', intervals: [0, 4, 7] },

    { id: 'sus2', name: 'Sus2', intervals: [0, 2, 7] },

    { id: 'maj7', name: 'maj7', intervals: [0, 4, 7, 11] },

    { id: '9', name: '9', intervals: [0, 4, 7, 10, 14] },
    { id: 'maj9', name: 'maj9', intervals: [0, 4, 7, 11, 14] },
    { id: 'm9', name: 'm9', intervals: [0, 3, 7, 10, 14] },
    { id: 'm(maj9)', name: 'm(maj9)', intervals: [0, 3, 7, 11, 14] },
    { id: 'add11', name: 'add11', intervals: [0, 4, 7, 17] },
    { id: 'm(add11)', name: 'm(add11)', intervals: [0, 3, 7, 17] },
    { id: '11', name: '11', intervals: [0, 4, 7, 10, 14, 17] },
    { id: 'maj11', name: 'maj11', intervals: [0, 4, 7, 11, 14, 17] },
    { id: 'm11', name: 'm11', intervals: [0, 3, 7, 10, 14, 17] },
    { id: '13', name: '13', intervals: [0, 4, 7, 10, 14, 17, 21] },
    { id: 'maj13', name: 'maj13', intervals: [0, 4, 7, 11, 14, 17, 21] },
    { id: 'm13', name: 'm13', intervals: [0, 3, 7, 10, 14, 17, 21] },
    { id: 'm(maj13)', name: 'm(maj13)', intervals: [0, 3, 7, 11, 14, 17, 21] },
  ];

  // 12 клавиш пианино: расположение колонок как в новом дизайне (14-колоночная сетка)
  const PIANO_KEYS = [
    { pc: 0, label: 'C', col: '1 / 3' },
    { pc: 1, label: 'C#/Db', col: '2 / 4', black: true },
    { pc: 2, label: 'D', col: '3 / 5' },
    { pc: 3, label: 'D#/Eb', col: '4 / 6', black: true },
    { pc: 4, label: 'E', col: '5 / 7' },
    { pc: 5, label: 'F', col: '7 / 9' },
    { pc: 6, label: 'F#/Gb', col: '8 / 10', black: true },
    { pc: 7, label: 'G', col: '9 / 11' },
    { pc: 8, label: 'G#/Ab', col: '10 / 12', black: true },
    { pc: 9, label: 'A', col: '11 / 13' },
    { pc: 10, label: 'A#/Bb', col: '12 / 14', black: true },
    { pc: 11, label: 'B', col: '13 / 15' },
  ];
  const NOTE_POOL_DEFAULT_SELECTED_PCS = new Set([0, 2, 4, 5, 7, 9, 11]);
  const ROOT_NOTE_DEFAULT_SELECTED_PCS = new Set([0, 2, 4, 5, 7, 9, 11]);

  const GM_INSTRUMENTS = [
    ['acoustic_grand_piano', 'Рояль (Grand Piano)'],
    ['bright_acoustic_piano', 'Яркое пианино'],
    ['electric_piano_1', 'Электропианино'],
    ['harpsichord', 'Клавесин'],
    ['acoustic_guitar_nylon', 'Гитара (нейлон)'],
    ['acoustic_guitar_steel', 'Гитара (сталь)'],
    ['violin', 'Скрипка'],
    ['viola', 'Альт'],
    ['cello', 'Виолончель'],
    ['contrabass', 'Контрабас'],
    ['trumpet', 'Труба'],
    ['trombone', 'Тромбон'],
    ['french_horn', 'Валторна'],
    ['flute', 'Флейта'],
    ['clarinet', 'Кларнет'],
    ['oboe', 'Гобой'],
    ['synth_strings_1', 'Синти-струнные'],
    ['choir_aahs', 'Хор (Aah)'],
  ];

  const GM_PROGRAMS = [
    [0, 'Рояль (Acoustic Grand Piano)'],
    [4, 'Электропианино (Rhodes)'],
    [6, 'Клавесин'],
    [24, 'Гитара (нейлон)'],
    [26, 'Электрогитара (чистая)'],
    [32, 'Бас (акустический)'],
    [40, 'Скрипка'],
    [41, 'Альт'],
    [42, 'Виолончель'],
    [43, 'Контрабас'],
    [48, 'Струнный ансамбль'],
    [56, 'Труба'],
    [57, 'Тромбон'],
    [60, 'Валторна'],
    [68, 'Гобой'],
    [71, 'Кларнет'],
    [73, 'Флейта'],
    [52, 'Хор (Choir Aahs)'],
  ];

  const OCTAVES = [
    { o: 0, label: 'A0–B0' }, { o: 1, label: 'C1–B1' }, { o: 2, label: 'C2–B2' },
    { o: 3, label: 'C3–B3' }, { o: 4, label: 'C4–B4' }, { o: 5, label: 'C5–B5' },
    { o: 6, label: 'C6–B6' }, { o: 7, label: 'C7–B7' }, { o: 8, label: 'C8' },
  ];
  const OCTAVE_DEFAULT_SELECTED = new Set([3, 4]);

  const state = {
    mode: 'notes',
    outputMode: 'daw',
    onlineInstrument: 'builtin',
    onlineVolume: 80,
    midiAnswerEnabled: false,
    octaveMatch: 'any',
    currentTarget: null,
    pendingPc: null,
    pendingChoiceId: null,
    pendingOct: null,
    answered: false,
  };

  let audioCtx = null;
  let midiAccess = null;
  const instrumentCache = {};
  let soundfontLoaderPromise = null;
  let activeInputNotes = new Set();
  let checkDebounceTimer = null;

  const $ = (id) => document.getElementById(id);
  const randInt = (n) => Math.floor(Math.random() * n);
  const randVelocity = () => randInt(Math.max(1, CFG.velocityMax - CFG.velocityMin + 1)) + CFG.velocityMin;

  function midiToName(m) { return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1); }
  function pcOctaveToMidi(pc, oct) { return (oct + 1) * 12 + pc; }
  function uniqSorted(arr) { return [...new Set(arr)].sort((a, b) => a - b); }
  function arraysEqual(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }

  function getSelectedOctaves() {
    return [...document.querySelectorAll('#octave-grid .toggle-chip.selected')].map((el) => parseInt(el.dataset.oct, 10));
  }
  function getSelectedNotePcs() {
    return uniqSorted([...document.querySelectorAll('#pool-grid .toggle-chip.selected')].map((el) => parseInt(el.dataset.pc, 10)));
  }
  function getSelectedIntervals() {
    const ids = [...document.querySelectorAll('#pool-grid .toggle-chip.selected')].map((el) => el.dataset.id);
    return INTERVALS.filter((iv) => ids.includes(iv.id));
  }
  function getSelectedRootPcs() {
    return uniqSorted([...document.querySelectorAll('#root-note-grid .toggle-chip.selected')].map((el) => parseInt(el.dataset.pc, 10)));
  }
  function getSelectedChords() {
    const ids = [...document.querySelectorAll('#pool-grid .toggle-chip.selected')].map((el) => el.dataset.id);
    return CHORDS.filter((c) => ids.includes(c.id));
  }
  function getMidiChannel() { return CFG.defaultMidiChannel || 1; }

  function showMidiStatus(msg, isError) {
    const el = $('midiStatus');
    el.textContent = msg;
    el.style.color = isError ? 'var(--bad-color)' : 'var(--text-hint)';
  }

  // ---------------- generation ----------------
  function generateTarget() {
    const octaves = getSelectedOctaves();
    if (octaves.length === 0) { alert('Выберите хотя бы одну октаву.'); return null; }

    if (state.mode === 'notes') {
      const pool = getSelectedNotePcs();
      if (pool.length === 0) { alert('Выберите хотя бы одну ноту.'); return null; }
      for (let a = 0; a < 60; a++) {
        const pc = pool[randInt(pool.length)];
        const oct = octaves[randInt(octaves.length)];
        const midi = pcOctaveToMidi(pc, oct);
        if (midi >= MIN_MIDI && midi <= MAX_MIDI) {
          return { type: 'notes', answerId: String(pc), notes: [midi], velocities: [randVelocity()] };
        }
      }
      alert('Не удалось подобрать ноту в выбранном диапазоне октав.');
      return null;
    }

    if (state.mode === 'intervals') {
      const pool = getSelectedIntervals();
      if (pool.length === 0) { alert('Выберите хотя бы один интервал.'); return null; }
      const rootPcs = getSelectedRootPcs();
      if (rootPcs.length === 0) { alert('Выберите хотя бы одну ноту, от которой строить интервал.'); return null; }
      for (let a = 0; a < 80; a++) {
        const pc = rootPcs[randInt(rootPcs.length)];
        const oct = octaves[randInt(octaves.length)];
        const root = pcOctaveToMidi(pc, oct);
        const iv = pool[randInt(pool.length)];
        const top = root + iv.semitones;
        if (root >= MIN_MIDI && top <= MAX_MIDI) {
          const notes = [root, top];
          return { type: 'intervals', answerId: iv.id, answerPc: pc, answerOct: oct, notes, velocities: notes.map(randVelocity) };
        }
      }
      alert('Не удалось подобрать интервал в выбранном диапазоне октав.');
      return null;
    }

    const pool = getSelectedChords();
    if (pool.length === 0) { alert('Выберите хотя бы один аккорд.'); return null; }
    const chordRootPcs = getSelectedRootPcs();
    if (chordRootPcs.length === 0) { alert('Выберите хотя бы одну ноту, от которой строить аккорд.'); return null; }
    for (let a = 0; a < 80; a++) {
      const pc = chordRootPcs[randInt(chordRootPcs.length)];
      const oct = octaves[randInt(octaves.length)];
      const root = pcOctaveToMidi(pc, oct);
      const chord = pool[randInt(pool.length)];
      const notes = chord.intervals.map((s) => root + s);
      if (notes[0] >= MIN_MIDI && notes[notes.length - 1] <= MAX_MIDI) {
        return { type: 'chords', answerId: chord.id, answerPc: pc, answerOct: oct, notes, velocities: notes.map(randVelocity) };
      }
    }
    alert('Не удалось подобрать аккорд в выбранном диапазоне октав — выберите больше октав.');
    return null;
  }

  function labelForTarget(target) {
    if (!target) return '';
    if (target.type === 'notes') return NOTE_NAMES[parseInt(target.answerId, 10)];
    if (target.type === 'intervals') return INTERVALS.find((i) => i.id === target.answerId).name;
    return CHORDS.find((c) => c.id === target.answerId).name;
  }

  // ---------------- playback: online ----------------
  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function builtinSynthPlay(midi, gain, durationSec) {
    const ctx = ensureAudioCtx();
    const freq = midiToFreq(midi);
    const t0 = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    const partials = [1, 2, 3, 4.2, 5.4];
    const partialGains = [1, 0.5, 0.25, 0.12, 0.06];
    partials.forEach((mult, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq * mult;
      const g = ctx.createGain();
      g.gain.value = partialGains[i];
      osc.connect(g).connect(master);
      osc.start(t0);
      osc.stop(t0 + durationSec + 0.5);
    });
    const partialGainSum = partialGains.reduce((a, b) => a + b, 0);
    master.gain.setValueAtTime(0, t0);
    master.gain.linearRampToValueAtTime(Math.max(0.008, (gain * 0.5) / partialGainSum), t0 + 0.008);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + durationSec + 0.4);
  }

  function loadSoundfontLib() {
    if (window.Soundfont) return Promise.resolve();
    if (soundfontLoaderPromise) return soundfontLoaderPromise;
    soundfontLoaderPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Не удалось загрузить soundfont-player с CDN'));
      document.head.appendChild(s);
    });
    return soundfontLoaderPromise;
  }

  async function loadSoundfontInstrument(name) {
    try {
      await loadSoundfontLib();
      const ctx = ensureAudioCtx();
      if (!instrumentCache[name]) instrumentCache[name] = await window.Soundfont.instrument(ctx, name);
      return instrumentCache[name];
    } catch (e) {
      console.error(e);
      return null;
    }
  }

  async function playOnline(notes, velocities) {
    ensureAudioCtx();
    const volMult = (state.onlineVolume / 100) * 2;
    if (state.onlineInstrument === 'builtin') {
      notes.forEach((n, i) => builtinSynthPlay(n, (velocities[i] / 127) * volMult, CFG.noteDurationMs / 1000));
      return;
    }
    const inst = await loadSoundfontInstrument(state.onlineInstrument);
    if (!inst) {
      notes.forEach((n, i) => builtinSynthPlay(n, (velocities[i] / 127) * volMult, CFG.noteDurationMs / 1000));
      return;
    }
    notes.forEach((n, i) => {
      inst.play(n, audioCtx.currentTime, { gain: (velocities[i] / 127) * volMult, duration: CFG.noteDurationMs / 1000 });
    });
  }

  // ---------------- playback: DAW ----------------
  function getSelectedMidiOutput() {
    if (!midiAccess) return null;
    const id = $('midiOutputSelect').value;
    return midiAccess.outputs.get(id) || null;
  }

  function playDAW(notes, velocities) {
    const output = getSelectedMidiOutput();
    if (!output) { showMidiStatus('MIDI-выход не выбран. Нажмите «Подключить MIDI».', true); return; }
    const ch = (getMidiChannel() - 1) & 0x0f;
    notes.forEach((n, i) => {
      const delay = i * CFG.chordStrumMs;
      setTimeout(() => output.send([0x90 | ch, n, velocities[i]]), delay);
      setTimeout(() => output.send([0x80 | ch, n, 0]), delay + CFG.noteDurationMs);
    });
  }

  function playTarget(target) {
    if (!target) return;
    if (state.outputMode === 'online') playOnline(target.notes, target.velocities);
    else playDAW(target.notes, target.velocities);
  }

  // ---------------- Web MIDI ----------------
  async function initMIDI() {
    if (!navigator.requestMIDIAccess) {
      showMidiStatus('Web MIDI API не поддерживается в этом браузере.', true);
      return;
    }
    try {
      midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      populateMidiPortSelects();
      midiAccess.onstatechange = populateMidiPortSelects;
      showMidiStatus('MIDI подключён.', false);
    } catch (e) {
      showMidiStatus('Доступ к MIDI не разрешён браузером.', true);
    }
  }

  function populateMidiPortSelects() {
    const outSel = $('midiOutputSelect');
    const inSel = $('midiInputSelect');
    const prevOut = outSel.value;
    const prevIn = inSel.value;
    outSel.innerHTML = '';
    inSel.innerHTML = '';
    for (const output of midiAccess.outputs.values()) {
      const opt = document.createElement('option');
      opt.value = output.id; opt.textContent = output.name;
      outSel.appendChild(opt);
    }
    for (const input of midiAccess.inputs.values()) {
      const opt = document.createElement('option');
      opt.value = input.id; opt.textContent = input.name;
      inSel.appendChild(opt);
    }
    if ([...outSel.options].some((o) => o.value === prevOut)) outSel.value = prevOut;
    if ([...inSel.options].some((o) => o.value === prevIn)) inSel.value = prevIn;
    attachMidiInputListener();
  }

  function attachMidiInputListener() {
    if (!midiAccess) return;
    for (const input of midiAccess.inputs.values()) input.onmidimessage = null;
    const input = midiAccess.inputs.get($('midiInputSelect').value);
    if (!input) return;
    input.onmidimessage = (e) => {
      const [status, note, vel] = e.data;
      const cmd = status & 0xf0;
      if (cmd === 0x90 && vel > 0) { activeInputNotes.add(note); scheduleMidiAnswerCheck(); }
      else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) activeInputNotes.delete(note);
    };
  }

  function scheduleMidiAnswerCheck() {
    if (!state.midiAnswerEnabled || !state.currentTarget || state.answered) return;
    clearTimeout(checkDebounceTimer);
    checkDebounceTimer = setTimeout(checkMidiAnswer, CFG.midiAnswerDebounceMs);
  }

  function checkMidiAnswer() {
    const target = state.currentTarget;
    if (!target || state.answered || activeInputNotes.size === 0) return;
    const played = [...activeInputNotes];
    let correct;
    if (state.octaveMatch === 'exact') correct = arraysEqual(uniqSorted(played), uniqSorted(target.notes));
    else correct = arraysEqual(uniqSorted(played.map((n) => n % 12)), uniqSorted(target.notes.map((n) => n % 12)));
    finishAnswer(correct, target, null);
  }

  // ---------------- feedback icon ----------------

  function setFeedback(correctOrNull) {
    const icon = $('feedbackIcon');
    icon.classList.remove('state-correct', 'state-incorrect');
    icon.textContent = '';
    if (correctOrNull === true) {
      icon.classList.add('state-correct');
      icon.textContent = '✓';
    } else if (correctOrNull === false) {
      icon.classList.add('state-incorrect');
      icon.textContent = '✗';
    }
  }

  // ---------------- answer UI ----------------
  function renderAnswerUI() {
    const piano = $('pianoAnswer');
    const chips = $('chipAnswer');
    const chipBox = $('chipAnswerBox');
    piano.style.display = 'flex';
    chips.style.display = state.mode === 'notes' ? 'none' : 'flex';
    chipBox.style.display = state.mode === 'notes' ? 'none' : 'block';
    piano.querySelectorAll('.toggle-chip').forEach((el) => {
      el.classList.remove('selected', 'correct', 'incorrect', 'disabled');
      el.style.pointerEvents = 'auto';
      el.style.opacity = '1';
    });

    chips.classList.remove('mode-intervals', 'mode-chords');
    if (state.mode !== 'notes') {
      chips.innerHTML = '';
      chips.classList.add(state.mode === 'intervals' ? 'mode-intervals' : 'mode-chords');
      const items = state.mode === 'intervals'
        ? getSelectedIntervals().map((iv) => ({ id: iv.id, label: iv.name }))
        : getSelectedChords().map((c) => ({ id: c.id, label: c.name }));
      items.forEach((it) => {
        const btn = document.createElement('div');
        btn.className = 'toggle-chip';
        btn.textContent = it.label;
        btn.dataset.id = it.id;
        btn.addEventListener('click', () => checkAnswer(it.id, btn));
        chips.appendChild(btn);
      });
    }

    renderOctaveAnswerRow();
  }

  function renderOctaveAnswerRow() {
    const row = $('octaveAnswerRow');
    const box = $('octaveAnswerBox');
    const octaves = getSelectedOctaves().filter((o) => o >= 1 && o <= 7);
    row.innerHTML = '';
    if (octaves.length < 2) {
      row.style.display = 'none';
      box.style.display = 'none';
      return;
    }
    row.style.display = 'flex';
    box.style.display = 'block';
    octaves.sort((a, b) => a - b).forEach((o) => {
      const btn = document.createElement('div');
      btn.className = 'toggle-chip';
      btn.textContent = String(o);
      btn.dataset.oct = o;
      btn.addEventListener('click', () => octaveAnswerClicked(o, btn));
      row.appendChild(btn);
    });
  }

  function checkAnswer(id, el) {
    if (state.answered) return;
    const target = state.currentTarget;
    if (!target) return;

    if (state.mode === 'notes') {
      const correct = id === target.answerId;
      finishAnswer(correct, target, id);
      return;
    }

    // Режимы "Интервалы"/"Аккорды": ответ составной — нота + интервал/аккорд (+ октава, если их несколько)
    state.pendingChoiceId = id;
    el.parentElement.querySelectorAll('.toggle-chip').forEach((c) => c.classList.remove('selected'));
    el.classList.add('selected');
    tryFinishCompositeAnswer(target);
  }

  function pianoNoteClicked(pc, el) {
    if (state.answered || state.mode === 'notes') return;
    state.pendingPc = pc;
    $('pianoAnswer').querySelectorAll('.toggle-chip').forEach((c) => c.classList.remove('selected'));
    el.classList.add('selected');
    tryFinishCompositeAnswer(state.currentTarget);
  }

  function octaveAnswerClicked(oct, el) {
    if (state.answered) return;
    state.pendingOct = oct;
    $('octaveAnswerRow').querySelectorAll('.toggle-chip').forEach((c) => c.classList.remove('selected'));
    el.classList.add('selected');
    tryFinishCompositeAnswer(state.currentTarget);
  }

  function tryFinishCompositeAnswer(target) {
    if (!target || state.mode === 'notes') return;
    const needsOct = getSelectedOctaves().filter((o) => o >= 1 && o <= 7).length >= 2;
    if (state.pendingPc === null || state.pendingChoiceId === null) return;
    if (needsOct && state.pendingOct === null) return;

    const correct = state.pendingChoiceId === target.answerId
      && state.pendingPc === target.answerPc
      && (!needsOct || state.pendingOct === target.answerOct);
    finishAnswer(correct, target, state.pendingChoiceId);
  }

  function finishAnswer(correct, target, chosenId) {
    state.answered = true;
    setFeedback(correct);

    if (state.mode === 'notes') {
      $('pianoAnswer').querySelectorAll('.toggle-chip').forEach((el) => {
        el.classList.add('disabled');
        if (String(el.dataset.pc) === target.answerId) el.classList.add('correct');
        else if (chosenId !== null && el.dataset.pc === chosenId) el.classList.add('incorrect');
      });
    } else {
      $('chipAnswer').querySelectorAll('.toggle-chip').forEach((el) => {
        el.classList.add('disabled');
        if (el.dataset.id === target.answerId) el.classList.add('correct');
        else if (chosenId !== null && el.dataset.id === chosenId) el.classList.add('incorrect');
      });
      $('pianoAnswer').querySelectorAll('.toggle-chip').forEach((el) => {
        el.classList.add('disabled');
        if (String(el.dataset.pc) === String(target.answerPc)) el.classList.add('correct');
        else if (state.pendingPc !== null && el.dataset.pc === String(state.pendingPc)) el.classList.add('incorrect');
      });
      $('octaveAnswerRow').querySelectorAll('.toggle-chip').forEach((el) => {
        el.classList.add('disabled');
        if (String(el.dataset.oct) === String(target.answerOct)) el.classList.add('correct');
        else if (state.pendingOct !== null && el.dataset.oct === String(state.pendingOct)) el.classList.add('incorrect');
      });
    }
  }

  function nextQuestion() {
    const target = generateTarget();
    if (!target) return;
    state.currentTarget = target;
    state.answered = false;
    state.pendingPc = null;
    state.pendingChoiceId = null;
    state.pendingOct = null;
    activeInputNotes.clear();
    setFeedback(null);
    renderAnswerUI();
    playTarget(target);
  }

  function replay() {
    if (!state.currentTarget) return;
    playTarget(state.currentTarget);
  }

  // ---------------- building settings UI ----------------
  function buildPianoGrid(grid, defaultSelectedPcs, onToggle) {
    grid.innerHTML = '';
    grid.className = 'piano-grid';
    // Сначала чёрные, потом белые клавиши — порядок в DOM важен для авто-раскладки грида
    const blacks = PIANO_KEYS.filter((k) => k.black);
    const whites = PIANO_KEYS.filter((k) => !k.black);
    [...blacks, ...whites].forEach((k) => {
      const chip = document.createElement('div');
      chip.className = 'toggle-chip' + (k.black ? ' black-key' : '') + (defaultSelectedPcs.has(k.pc) ? ' selected' : '');
      chip.textContent = k.label;
      chip.dataset.pc = k.pc;
      chip.style.gridColumn = k.col;
      chip.addEventListener('click', () => { chip.classList.toggle('selected'); if (onToggle) onToggle(); });
      grid.appendChild(chip);
    });
  }

  function buildRootNoteGrid() {
    buildPianoGrid($('root-note-grid'), ROOT_NOTE_DEFAULT_SELECTED_PCS, null);
  }

  function buildPoolGrid() {
    const grid = $('pool-grid');
    grid.innerHTML = '';

    const showRoot = state.mode === 'intervals' || state.mode === 'chords';
    $('rootNoteSection').style.display = showRoot ? 'block' : 'none';
    if (showRoot) buildRootNoteGrid();

    if (state.mode === 'notes') {
      buildPianoGrid(grid, NOTE_POOL_DEFAULT_SELECTED_PCS, renderAnswerUI);
    } else if (state.mode === 'intervals') {
      grid.className = 'intervals-grid';
      INTERVALS.forEach((iv) => {
        const chip = document.createElement('div');
        chip.className = 'toggle-chip selected';
        chip.textContent = iv.name;
        chip.dataset.id = iv.id;
        chip.addEventListener('click', () => { chip.classList.toggle('selected'); renderAnswerUI(); });
        grid.appendChild(chip);
      });
    } else {
      grid.className = 'chords-grid';
      CHORDS.forEach((c) => {
        const def = c.id === 'maj' || c.id === 'min';
        const chip = document.createElement('div');
        chip.className = 'toggle-chip' + (def ? ' selected' : '');
        chip.textContent = c.name;
        chip.dataset.id = c.id;
        chip.addEventListener('click', () => { chip.classList.toggle('selected'); renderAnswerUI(); });
        grid.appendChild(chip);
      });
    }
  }

  function buildOctaveGrid() {
    const grid = $('octave-grid');
    grid.innerHTML = '';
    OCTAVES.forEach((o) => {
      const chip = document.createElement('div');
      chip.className = 'toggle-chip' + (OCTAVE_DEFAULT_SELECTED.has(o.o) ? ' selected' : '');
      chip.textContent = o.label;
      chip.dataset.oct = o.o;
      chip.addEventListener('click', () => { chip.classList.toggle('selected'); renderOctaveAnswerRow(); });
      grid.appendChild(chip);
    });
  }

  function buildSelects() {
    const onlineSel = $('onlineInstrumentSelect');
    const builtinOpt = document.createElement('option');
    builtinOpt.value = 'builtin';
    builtinOpt.textContent = 'Встроенный синтезатор (без интернета)';
    onlineSel.appendChild(builtinOpt);
    GM_INSTRUMENTS.forEach(([id, name]) => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = name + ' (сэмпл из интернета)';
      onlineSel.appendChild(opt);
    });
    onlineSel.addEventListener('change', (e) => { state.onlineInstrument = e.target.value; });

  }

  // ---------------- wiring ----------------
  function wireEvents() {
    $('nextQuestionBtn').addEventListener('click', nextQuestion);
    $('replayBtn').addEventListener('click', replay);

    $('pianoAnswer').querySelectorAll('.toggle-chip').forEach((el) => {
      el.addEventListener('click', () => {
        if (state.mode === 'notes') checkAnswer(el.dataset.pc, el);
        else pianoNoteClicked(el.dataset.pc, el);
      });
    });

    document.querySelectorAll('#modeTabs .tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#modeTabs .tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
        buildPoolGrid();
        state.currentTarget = null;
        state.answered = false;
        setFeedback(null);
        renderAnswerUI();
        $('audioOutputSection').style.display = state.mode === 'notes' ? 'flex' : 'none';
      });
    });

    $('selectAllPool').addEventListener('click', () => {
      document.querySelectorAll('#pool-grid .toggle-chip').forEach((c) => c.classList.add('selected'));
      renderAnswerUI();
    });
    $('selectNonePool').addEventListener('click', () => {
      document.querySelectorAll('#pool-grid .toggle-chip').forEach((c) => c.classList.remove('selected'));
      renderAnswerUI();
    });

    document.querySelectorAll('#outputSegment .segment-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#outputSegment .segment-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.outputMode = btn.dataset.output;
        $('onlineFields').style.display = state.outputMode === 'online' ? 'block' : 'none';
        $('dawFields').style.display = state.outputMode === 'daw' ? 'block' : 'none';
      });
    });
    // Привести поля вывода звука в соответствие с активной по умолчанию вкладкой (DAW)
    $('onlineFields').style.display = state.outputMode === 'online' ? 'block' : 'none';
    $('dawFields').style.display = state.outputMode === 'daw' ? 'block' : 'none';

    // Показ/скрытие панели настроек колесом мыши (как в gemini-menu)
    window.addEventListener('wheel', (e) => {
      const rightPanel = $('right-panel');
      if (e.deltaY < 0) {
        rightPanel.classList.add('visible');
      } else if (e.deltaY > 0) {
        rightPanel.classList.remove('visible');
      }
    });

    $('volumeSlider').addEventListener('input', (e) => {
      state.onlineVolume = parseInt(e.target.value, 10);
      $('volume-val').textContent = e.target.value + '%';
    });

    $('connectMidiBtn').addEventListener('click', initMIDI);
    $('midiInputSelect').addEventListener('change', attachMidiInputListener);

    $('midiAnswerToggle').addEventListener('change', (e) => {
      state.midiAnswerEnabled = e.target.checked;
      $('midiAnswerFields').style.display = state.midiAnswerEnabled ? 'block' : 'none';
    });

    document.querySelectorAll('#octaveMatchSegment .segment-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#octaveMatchSegment .segment-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.octaveMatch = btn.dataset.octavematch;
      });
    });

    $('themeSelect').addEventListener('change', (e) => {
      document.body.setAttribute('data-theme', e.target.value);
    });

    document.querySelectorAll('#colorModeSegment .segment-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#colorModeSegment .segment-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.colormode === 'neon') {
          document.documentElement.setAttribute('data-colormode', 'neon');
          document.body.setAttribute('data-colormode', 'neon');
        } else {
          document.documentElement.removeAttribute('data-colormode');
          document.body.removeAttribute('data-colormode');
        }
        try { localStorage.setItem('earTrainerColorMode', btn.dataset.colormode); } catch (e) {}
      });
    });

  }

  function init() {
    try {
      const savedColorMode = localStorage.getItem('earTrainerColorMode');
      if (savedColorMode === 'neon') {
        document.documentElement.setAttribute('data-colormode', 'neon');
        document.body.setAttribute('data-colormode', 'neon');
        document.querySelectorAll('#colorModeSegment .segment-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.colormode === 'neon');
        });
      } else if (savedColorMode === 'muted') {
        document.documentElement.removeAttribute('data-colormode');
        document.body.removeAttribute('data-colormode');
        document.querySelectorAll('#colorModeSegment .segment-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.colormode === 'muted');
        });
      }
    } catch (e) {}
    buildPoolGrid();
    buildOctaveGrid();
    buildSelects();
    wireEvents();
    renderAnswerUI();
    setFeedback(null);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
